services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: plyli_dev
      MYSQL_USER: plyli
      MYSQL_PASSWORD: ${PLYLI_MYSQL_PASSWORD:?Set PLYLI_MYSQL_PASSWORD in your shell}
    volumes:
      - plyli_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  plyli_mysql:
